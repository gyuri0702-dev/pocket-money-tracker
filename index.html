<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>용돈플래너 - 게임 같은 가계부</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f1419;
      --bg-2:#1a1f2e;
      --panel:#1d2231;
      --panel-light:#252d3d;
      --text:#f5f7fa;
      --text-2:#a8b5c8;
      --primary:#6366f1;
      --primary-2:#818cf8;
      --accent:#10b981;
      --accent-2:#fbbf24;
      --danger:#ef4444;
      --line:#2d3547;
      --shadow:0 25px 50px rgba(0,0,0,.5);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:'Noto Sans KR', sans-serif;
      background:linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
      color:var(--text);
      overflow-x:hidden;
    }

    .app-container{
      display:grid;
      grid-template-columns:280px 1fr;
      min-height:100vh;
      gap:0;
    }

    /* 사이드바 */
    .sidebar{
      background:linear-gradient(180deg, #1a1f2e 0%, #151a27 100%);
      border-right:1px solid var(--line);
      padding:20px 16px;
      display:flex;
      flex-direction:column;
      gap:20px;
      position:fixed;
      width:280px;
      height:100vh;
      overflow-y:auto;
    }

    .logo-area{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }

    .logo-icon{
      width:44px;
      height:44px;
      border-radius:12px;
      background:linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display:grid;
      place-items:center;
      font-size:1.5rem;
      box-shadow:0 12px 24px rgba(99,102,241,.3);
    }

    .logo-text{
      font-weight:800;
      font-size:1.1rem;
      letter-spacing:-0.05em;
    }

    .user-profile{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px 12px;
      text-align:center;
    }

    .user-level{
      font-size:2rem;
      margin-bottom:6px;
    }

    .user-name{
      font-weight:700;
      margin-bottom:8px;
    }

    .user-stat{
      display:flex;
      justify-content:space-around;
      gap:8px;
      margin-top:10px;
    }

    .user-stat > div{
      text-align:center;
    }

    .user-stat-val{
      font-weight:800;
      font-size:1.1rem;
      color:var(--accent);
    }

    .user-stat-label{
      font-size:.7rem;
      color:var(--text-2);
      margin-top:2px;
    }

    .nav-menu{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .nav-item{
      padding:12px 14px;
      border-radius:12px;
      cursor:pointer;
      background:rgba(255,255,255,.04);
      border:1px solid transparent;
      transition:.2s ease;
      font-weight:600;
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--text-2);
    }

    .nav-item:hover{
      background:rgba(99,102,241,.1);
      border-color:var(--primary);
      color:var(--text);
    }

    .nav-item.active{
      background:linear-gradient(135deg, rgba(99,102,241,.2), rgba(16,185,129,.1));
      border-color:var(--primary);
      color:var(--primary);
    }

    .nav-item span:first-child{
      font-size:1.2rem;
    }

    /* 메인 콘텐츠 */
    .main-content{
      margin-left:280px;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 24px;
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      border-radius:16px;
      gap:20px;
    }

    .header-title{
      font-size:1.8rem;
      font-weight:800;
      letter-spacing:-0.05em;
    }

    .header-date{
      color:var(--text-2);
      font-weight:600;
    }

    .header-action{
      margin-left:auto;
      display:flex;
      gap:10px;
    }

    .btn{
      border:none;
      cursor:pointer;
      border-radius:12px;
      font-weight:700;
      transition:.2s ease;
      font-family:inherit;
      font-size:.95rem;
      padding:10px 16px;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .btn-primary{
      background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color:#fff;
      box-shadow:0 12px 24px rgba(99,102,241,.3);
    }

    .btn-primary:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 32px rgba(99,102,241,.4);
    }

    .btn-secondary{
      background:rgba(255,255,255,.04);
      border:1px solid var(--line);
      color:var(--text);
    }

    .btn-secondary:hover{
      background:rgba(99,102,241,.1);
      border-color:var(--primary);
    }

    .grid-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .grid-3{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:16px;
    }

    .card{
      background:linear-gradient(135deg, #1d2231 0%, #252d3d 100%);
      border:1px solid var(--line);
      border-radius:20px;
      padding:24px;
      box-shadow:var(--shadow);
    }

    .card-title{
      font-size:1.1rem;
      font-weight:700;
      margin-bottom:16px;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .card-large-text{
      font-size:2.8rem;
      font-weight:900;
      letter-spacing:-0.06em;
      line-height:1;
      margin:16px 0;
    }

    .card-sub{
      color:var(--text-2);
      font-size:.95rem;
      margin-top:10px;
    }

    .progress-bar{
      width:100%;
      height:10px;
      background:rgba(255,255,255,.08);
      border-radius:999px;
      overflow:hidden;
      margin:12px 0;
    }

    .progress-fill{
      height:100%;
      background:linear-gradient(90deg, var(--primary), var(--accent));
      border-radius:inherit;
      transition:width .3s ease;
    }

    /* 추가 모달 */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.7);
      z-index:100;
      align-items:center;
      justify-content:center;
      backdrop-filter:blur(4px);
    }

    .modal.active{
      display:flex;
    }

    .modal-content{
      background:linear-gradient(135deg, #1d2231 0%, #252d3d 100%);
      border:1px solid var(--line);
      border-radius:24px;
      padding:28px;
      max-width:500px;
      width:90%;
      box-shadow:var(--shadow);
    }

    .modal-title{
      font-size:1.6rem;
      font-weight:800;
      margin-bottom:20px;
    }

    .form-group{
      margin-bottom:16px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:700;
      font-size:.95rem;
    }

    .form-group input,
    .form-group select{
      width:100%;
      padding:12px 14px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      border-radius:10px;
      color:var(--text);
      font-family:inherit;
      font-size:.95rem;
    }

    .form-group input:focus,
    .form-group select:focus{
      outline:none;
      border-color:var(--primary);
      background:rgba(99,102,241,.1);
    }

    .category-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:10px;
      margin-bottom:16px;
    }

    .category-btn{
      padding:12px;
      background:rgba(255,255,255,.04);
      border:2px solid transparent;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      transition:.2s ease;
      font-size:.9rem;
    }

    .category-btn:hover{
      border-color:var(--primary);
      background:rgba(99,102,241,.1);
    }

    .category-btn.active{
      background:linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-color:var(--primary);
      color:#fff;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      margin-top:24px;
    }

    .modal-actions button{
      flex:1;
    }

    /* 거래 목록 */
    .transaction-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:16px;
    }

    .transaction-item{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      background:rgba(255,255,255,.02);
      border:1px solid var(--line);
      border-radius:12px;
      transition:.2s ease;
    }

    .transaction-item:hover{
      background:rgba(255,255,255,.04);
      border-color:var(--primary);
    }

    .tx-icon{
      font-size:1.3rem;
    }

    .tx-info{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .tx-title{
      font-weight:700;
      font-size:.95rem;
    }

    .tx-time{
      color:var(--text-2);
      font-size:.8rem;
    }

    .tx-amount{
      font-weight:800;
      font-size:1rem;
    }

    .tx-plus{
      color:var(--accent);
    }

    .tx-minus{
      color:var(--danger);
    }

    /* 배지 */
    .badges-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:12px;
      margin-top:16px;
    }

    .badge-item{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:16px 12px;
      background:rgba(255,255,255,.02);
      border:1px solid var(--line);
      border-radius:14px;
      text-align:center;
      opacity:.5;
      transition:.3s ease;
    }

    .badge-item.unlocked{
      opacity:1;
      background:linear-gradient(135deg, rgba(99,102,241,.15), rgba(16,185,129,.1));
      border-color:var(--primary);
      box-shadow:0 8px 16px rgba(99,102,241,.15);
    }

    .badge-icon{
      font-size:2rem;
    }

    .badge-name{
      font-size:.8rem;
      font-weight:700;
      color:var(--text-2);
    }

    .badge-item.unlocked .badge-name{
      color:var(--text);
    }

    /* 목표 카드 */
    .goal-card{
      background:linear-gradient(135deg, #1d2231 0%, #252d3d 100%);
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px;
      position:relative;
      overflow:hidden;
    }

    .goal-header{
      display:flex;
      justify-content:space-between;
      align-items:start;
      margin-bottom:12px;
    }

    .goal-emoji{
      font-size:2rem;
    }

    .goal-status{
      background:rgba(99,102,241,.2);
      color:var(--primary);
      padding:4px 10px;
      border-radius:999px;
      font-size:.75rem;
      font-weight:700;
    }

    .goal-name{
      font-weight:800;
      font-size:1.1rem;
      margin-bottom:4px;
    }

    .goal-desc{
      color:var(--text-2);
      font-size:.9rem;
      margin-bottom:12px;
    }

    .goal-progress{
      margin:12px 0;
    }

    .goal-meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:var(--text-2);
      font-size:.85rem;
      font-weight:700;
    }

    .goal-amount{
      color:var(--accent);
      font-size:1rem;
    }

    /* 반응형 */
    @media (max-width: 1200px){
      .app-container{
        grid-template-columns:1fr;
      }

      .sidebar{
        position:relative;
        width:100%;
        height:auto;
        flex-direction:row;
        border-right:none;
        border-bottom:1px solid var(--line);
      }

      .main-content{
        margin-left:0;
      }

      .grid-2, .grid-3{
        grid-template-columns:1fr;
      }

      .header{
        flex-direction:column;
        align-items:flex-start;
      }

      .header-action{
        margin-left:0;
      }
    }

    @media (max-width: 768px){
      .app-container{
        gap:0;
      }

      .sidebar{
        flex-direction:column;
        gap:12px;
      }

      .nav-menu{
        flex-direction:row;
        overflow-x:auto;
      }

      .nav-item{
        white-space:nowrap;
        flex:0 0 auto;
      }

      .user-profile{
        display:none;
      }

      .badges-grid{
        grid-template-columns:repeat(3, 1fr);
      }

      .header-action{
        flex-direction:column;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="logo-area">
        <div class="logo-icon">₩</div>
        <div class="logo-text">용돈플래너</div>
      </div>

      <div class="user-profile">
        <div class="user-level">🏅</div>
        <div class="user-name">Level <span id="userLevel">5</span></div>
        <div class="user-stat">
          <div>
            <div class="user-stat-val" id="totalSaved">₩12.5M</div>
            <div class="user-stat-label">저축</div>
          </div>
          <div>
            <div class="user-stat-val" id="streak">15</div>
            <div class="user-stat-label">일 스트릭</div>
          </div>
          <div>
            <div class="user-stat-val" id="badges">8</div>
            <div class="user-stat-label">배지</div>
          </div>
        </div>
      </div>

      <nav class="nav-menu">
        <div class="nav-item active" onclick="switchTab('dashboard')">
          <span>📊</span>
          <span>대시보드</span>
        </div>
        <div class="nav-item" onclick="switchTab('transactions')">
          <span>💳</span>
          <span>거래내역</span>
        </div>
        <div class="nav-item" onclick="switchTab('goals')">
          <span>🎯</span>
          <span>목표</span>
        </div>
        <div class="nav-item" onclick="switchTab('badges')">
          <span>🏆</span>
          <span>배지</span>
        </div>
      </nav>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div class="main-content">
      <div class="header">
        <div>
          <div class="header-title" id="pageTitle">대시보드</div>
          <div class="header-date" id="currentDate"></div>
        </div>
        <div class="header-action">
          <button class="btn btn-secondary" onclick="openAddModal()">📥 수입 추가</button>
          <button class="btn btn-primary" onclick="openExpenseModal()">➕ 지출 추가</button>
        </div>
      </div>

      <!-- 대시보드 탭 -->
      <div id="dashboard-tab">
        <div class="grid-2">
          <div class="card">
            <div class="card-title">💰 이번 달 수입</div>
            <div class="card-large-text" id="monthIncome">₩0</div>
            <div class="card-sub">vs 지난달 <span style="color:var(--accent)">+₩50,000</span></div>
          </div>

          <div class="card">
            <div class="card-title">🧾 이번 달 지출</div>
            <div class="card-large-text" id="monthExpense">₩0</div>
            <div class="card-sub">vs 지난달 <span style="color:var(--danger)">-₩30,000</span></div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-title">📈 저축률</div>
            <div class="card-large-text" id="savingRate">0%</div>
            <div class="progress-bar">
              <div class="progress-fill" id="savingBarFill" style="width:45%"></div>
            </div>
            <div class="card-sub">목표: 60% 📍 <span style="color:var(--danger)">15% 부족</span></div>
          </div>

          <div class="card">
            <div class="card-title">🎯 목표 진행률</div>
            <div class="card-large-text" id="goalProgress">0%</div>
            <div class="progress-bar">
              <div class="progress-fill" id="goalBarFill" style="width:65%"></div>
            </div>
            <div class="card-sub">2개 목표 진행 중 · 1개 달성!</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">📋 최근 거래</div>
          <div class="transaction-list" id="recentTransactions"></div>
        </div>
      </div>

      <!-- 거래내역 탭 -->
      <div id="transactions-tab" style="display:none;">
        <div class="card">
          <div class="card-title">모든 거래 기록</div>
          <div class="transaction-list" id="allTransactions"></div>
        </div>
      </div>

      <!-- 목표 탭 -->
      <div id="goals-tab" style="display:none;">
        <button class="btn btn-primary" onclick="openGoalModal()" style="margin-bottom:20px;">
          ✨ 새 목표 추가
        </button>
        <div class="grid-3" id="goalsGrid"></div>
      </div>

      <!-- 배지 탭 -->
      <div id="badges-tab" style="display:none;">
        <div class="card">
          <div class="card-title">🏆 나의 배지</div>
          <div class="badges-grid" id="badgesGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 지출 추가 모달 -->
  <div class="modal" id="expenseModal">
    <div class="modal-content">
      <div class="modal-title">💳 지출 기록하기</div>
      <div class="form-group">
        <label>카테고리 선택</label>
        <div class="category-grid">
          <button class="category-btn" onclick="selectCategory(this, '음식')">🍔 음식</button>
          <button class="category-btn" onclick="selectCategory(this, '교통')">🚗 교통</button>
          <button class="category-btn" onclick="selectCategory(this, '쇼핑')">🛍️ 쇼핑</button>
          <button class="category-btn" onclick="selectCategory(this, '오락')">🎮 오락</button>
          <button class="category-btn" onclick="selectCategory(this, '학용')">📚 학용</button>
          <button class="category-btn" onclick="selectCategory(this, '기타')">📌 기타</button>
        </div>
        <input type="hidden" id="selectedCategory" value="">
      </div>
      <div class="form-group">
        <label>금액</label>
        <input type="number" id="expenseAmount" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>메모</label>
        <input type="text" id="expenseMemo" placeholder="뭘 샀나요?">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModals()">취소</button>
        <button class="btn btn-primary" onclick="addExpense()">추가</button>
      </div>
    </div>
  </div>

  <!-- 수입 추가 모달 -->
  <div class="modal" id="incomeModal">
    <div class="modal-content">
      <div class="modal-title">📥 수입 기록하기</div>
      <div class="form-group">
        <label>수입원</label>
        <input type="text" id="incomeSource" placeholder="용돈, 아르바이트, 등등">
      </div>
      <div class="form-group">
        <label>금액</label>
        <input type="number" id="incomeAmount" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>메모</label>
        <input type="text" id="incomeMemo" placeholder="어디서 받았나요?">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModals()">취소</button>
        <button class="btn btn-primary" onclick="addIncome()">추가</button>
      </div>
    </div>
  </div>

  <!-- 목표 추가 모달 -->
  <div class="modal" id="goalModal">
    <div class="modal-content">
      <div class="modal-title">🎯 새 목표 만들기</div>
      <div class="form-group">
        <label>목표 이름</label>
        <input type="text" id="goalName" placeholder="예: 게임기 구매">
      </div>
      <div class="form-group">
        <label>목표 금액</label>
        <input type="number" id="goalAmount" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>목표 기간 (개월)</label>
        <input type="number" id="goalMonths" placeholder="3" min="1">
      </div>
      <div class="form-group">
        <label>이모지 선택</label>
        <div class="category-grid">
          <button class="category-btn" onclick="selectGoalEmoji(this, '🎮')">🎮</button>
          <button class="category-btn" onclick="selectGoalEmoji(this, '📱')">📱</button>
          <button class="category-btn" onclick="selectGoalEmoji(this, '🎧')">🎧</button>
          <button class="category-btn" onclick="selectGoalEmoji(this, '✈️')">✈️</button>
          <button class="category-btn" onclick="selectGoalEmoji(this, '🏠')">🏠</button>
          <button class="category-btn" onclick="selectGoalEmoji(this, '📚')">📚</button>
        </div>
        <input type="hidden" id="selectedEmoji" value="🎮">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModals()">취소</button>
        <button class="btn btn-primary" onclick="addGoal()">만들기</button>
      </div>
    </div>
  </div>

  <script>
    // 데이터 저장소
    let appData = {
      level: 5,
      exp: 250,
      streak: 15,
      totalSaved: 12500000,
      transactions: [],
      goals: [],
      badges: [
        { name: '시작', emoji: '🚀', unlocked: true },
        { name: '저축왕', emoji: '💰', unlocked: true },
        { name: '연속기록', emoji: '🔥', unlocked: true },
        { name: '목표달성', emoji: '🎯', unlocked: true },
        { name: '100만원', emoji: '💎', unlocked: true },
        { name: '매일기록', emoji: '📅', unlocked: true },
        { name: '500만원', emoji: '👑', unlocked: true },
        { name: '배짱', emoji: '🦾', unlocked: true },
        { name: '미래', emoji: '🌟', unlocked: false },
        { name: '고수', emoji: '🧙', unlocked: false },
        { name: '부자', emoji: '🤑', unlocked: false },
        { name: '전설', emoji: '⭐', unlocked: false },
      ]
    };

    // 초기 데이터
    const sampleData = [
      { type: 'expense', category: '음식', amount: 18000, memo: '점심', date: new Date(2024, 9, 12) },
      { type: 'income', category: '용돈', amount: 50000, memo: '엄마한테 받음', date: new Date(2024, 9, 12) },
      { type: 'expense', category: '쇼핑', amount: 45000, memo: '옷 구매', date: new Date(2024, 9, 11) },
      { type: 'expense', category: '오락', amount: 15000, memo: '게임', date: new Date(2024, 9, 11) },
      { type: 'income', category: '아르바이트', amount: 150000, memo: '카페 알바', date: new Date(2024, 9, 10) },
      { type: 'expense', category: '음식', amount: 12000, memo: '저녁', date: new Date(2024, 9, 10) },
    ];

    const sampleGoals = [
      { emoji: '🎮', name: '게임기', amount: 500000, current: 340000, deadline: 3 },
      { emoji: '✈️', name: '여행', amount: 1500000, current: 780000, deadline: 5 },
      { emoji: '📱', name: '핸드폰', amount: 1000000, current: 650000, deadline: 4 },
    ];

    appData.transactions = sampleData;
    appData.goals = sampleGoals;

    // 날짜 포맷팅
    function formatDate(date) {
      const today = new Date();
      const d = new Date(date);
      const diff = today - d;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));

      if (days === 0) return '오늘';
      if (days === 1) return '어제';
      if (days < 7) return `${days}일 전`;
      return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
    }

    function getCategoryEmoji(category) {
      const map = {
        '음식': '🍔',
        '교통': '🚗',
        '쇼핑': '🛍️',
        '오락': '🎮',
        '학용': '📚',
        '용돈': '💰',
        '아르바이트': '💼',
        '기타': '📌'
      };
      return map[category] || '📌';
    }

    function updateUI() {
      // 수입/지출 계산
      const now = new Date();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      const monthTransactions = appData.transactions.filter(t => {
        const d = new Date(t.date);
        return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
      });

      const income = monthTransactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + t.amount, 0);

      const expense = monthTransactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + t.amount, 0);

      const saving = income - expense;
      const savingRate = income > 0 ? Math.round((saving / income) * 100) : 0;

      // DOM 업데이트
      document.getElementById('monthIncome').textContent = `₩${income.toLocaleString()}`;
      document.getElementById('monthExpense').textContent = `₩${expense.toLocaleString()}`;
      document.getElementById('savingRate').textContent = `${savingRate}%`;
      document.getElementById('savingBarFill').style.width = `${Math.min(savingRate, 100)}%`;

      // 목표 진행률
      const totalGoal = appData.goals.reduce((sum, g) => sum + g.current, 0);
      const totalGoalAmount = appData.goals.reduce((sum, g) => sum + g.amount, 0);
      const goalRate = totalGoalAmount > 0 ? Math.round((totalGoal / totalGoalAmount) * 100) : 0;
      document.getElementById('goalProgress').textContent = `${goalRate}%`;
      document.getElementById('goalBarFill').style.width = `${Math.min(goalRate, 100)}%`;

      // 레벨/통계
      document.getElementById('userLevel').textContent = appData.level;
      document.getElementById('totalSaved').textContent = `₩${(appData.totalSaved / 1000000).toFixed(1)}M`;
      document.getElementById('streak').textContent = appData.streak;
      document.getElementById('badges').textContent = appData.badges.filter(b => b.unlocked).length;

      // 날짜
      const today = new Date();
      document.getElementById('currentDate').textContent = today.toLocaleDateString('ko-KR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      });

      // 거래 목록
      updateTransactionList();
      updateGoalsList();
      updateBadges();
    }

    function updateTransactionList(allTx = false) {
      const list = allTx ? appData.transactions : appData.transactions.slice(0, 5);
      const container = allTx ? document.getElementById('allTransactions') : document.getElementById('recentTransactions');

      container.innerHTML = list.map(tx => `
        <div class="transaction-item">
          <div class="tx-icon">${getCategoryEmoji(tx.category)}</div>
          <div class="tx-info">
            <div class="tx-title">${tx.memo || tx.category}</div>
            <div class="tx-time">${formatDate(tx.date)}</div>
          </div>
          <div class="tx-amount ${tx.type === 'income' ? 'tx-plus' : 'tx-minus'}">
            ${tx.type === 'income' ? '+' : '-'}₩${tx.amount.toLocaleString()}
          </div>
        </div>
      `).join('');
    }

    function updateGoalsList() {
      const container = document.getElementById('goalsGrid');
      container.innerHTML = appData.goals.map(goal => {
        const progress = Math.round((goal.current / goal.amount) * 100);
        return `
          <div class="goal-card">
            <div class="goal-header">
              <div class="goal-emoji">${goal.emoji}</div>
              <div class="goal-status">${progress}%</div>
            </div>
            <div class="goal-name">${goal.name}</div>
            <div class="goal-desc">목표금액: ₩${goal.amount.toLocaleString()}</div>
            <div class="goal-progress">
              <div class="progress-bar">
                <div class="progress-fill" style="width:${progress}%"></div>
              </div>
            </div>
            <div class="goal-meta">
              <span class="goal-amount">₩${goal.current.toLocaleString()}</span>
              <span>${goal.deadline}개월 남음</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateBadges() {
      const container = document.getElementById('badgesGrid');
      container.innerHTML = appData.badges.map(badge => `
        <div class="badge-item ${badge.unlocked ? 'unlocked' : ''}">
          <div class="badge-icon">${badge.emoji}</div>
          <div class="badge-name">${badge.name}</div>
        </div>
      `).join('');
    }

    function switchTab(tabName) {
      // 탭 전환
      document.querySelectorAll('[id$="-tab"]').forEach(el => el.style.display = 'none');
      document.getElementById(tabName + '-tab').style.display = 'block';

      // 네비게이션 활성화
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.nav-item').classList.add('active');

      // 제목 변경
      const titles = {
        'dashboard': '대시보드',
        'transactions': '거래내역',
        'goals': '목표',
        'badges': '배지'
      };
      document.getElementById('pageTitle').textContent = titles[tabName];

      if (tabName === 'transactions') updateTransactionList(true);
    }

    function openExpenseModal() {
      document.getElementById('expenseModal').classList.add('active');
      document.getElementById('selectedCategory').value = '';
      document.getElementById('expenseAmount').value = '';
      document.getElementById('expenseMemo').value = '';
      document.querySelectorAll('#expenseModal .category-btn').forEach(btn => btn.classList.remove('active'));
    }

    function openAddModal() {
      document.getElementById('incomeModal').classList.add('active');
      document.getElementById('incomeSource').value = '';
      document.getElementById('incomeAmount').value = '';
      document.getElementById('incomeMemo').value = '';
    }

    function openGoalModal() {
      document.getElementById('goalModal').classList.add('active');
      document.getElementById('goalName').value = '';
      document.getElementById('goalAmount').value = '';
      document.getElementById('goalMonths').value = '';
      document.getElementById('selectedEmoji').value = '🎮';
      document.querySelectorAll('#goalModal .category-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('#goalModal .category-btn')[0].classList.add('active');
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }

    function selectCategory(btn, category) {
      btn.parentElement.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('selectedCategory').value = category;
    }

    function selectGoalEmoji(btn, emoji) {
      btn.parentElement.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('selectedEmoji').value = emoji;
    }

    function addExpense() {
      const category = document.getElementById('selectedCategory').value;
      const amount = parseInt(document.getElementById('expenseAmount').value) || 0;
      const memo = document.getElementById('expenseMemo').value;

      if (!category || amount === 0) {
        alert('카테고리와 금액을 입력해주세요!');
        return;
      }

      appData.transactions.unshift({
        type: 'expense',
        category,
        amount,
        memo,
        date: new Date()
      });

      closeModals();
      updateUI();
      alert('지출이 기록되었습니다! 🎉');
    }

    function addIncome() {
      const source = document.getElementById('incomeSource').value;
      const amount = parseInt(document.getElementById('incomeAmount').value) || 0;
      const memo = document.getElementById('incomeMemo').value;

      if (!source || amount === 0) {
        alert('수입원과 금액을 입력해주세요!');
        return;
      }

      appData.transactions.unshift({
        type: 'income',
        category: source,
        amount,
        memo,
        date: new Date()
      });

      closeModals();
      updateUI();
      alert('수입이 기록되었습니다! 💰');
    }

    function addGoal() {
      const name = document.getElementById('goalName').value;
      const amount = parseInt(document.getElementById('goalAmount').value) || 0;
      const months = parseInt(document.getElementById('goalMonths').value) || 1;
      const emoji = document.getElementById('selectedEmoji').value;

      if (!name || amount === 0) {
        alert('목표 이름과 금액을 입력해주세요!');
        return;
      }

      appData.goals.push({
        emoji,
        name,
        amount,
        current: 0,
        deadline: months
      });

      closeModals();
      updateUI();
      alert('새 목표가 생성되었습니다! 🎯');
    }

    // 초기화
    updateUI();

    // 모달 외부 클릭 시 닫기
    document.querySelectorAll('.modal').forEach(modal => {
      modal.addEventListener('click', e => {
        if (e.target === modal) closeModals();
      });
    });
  </script>
</body>
</html>
