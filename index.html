<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>용돈플래너 - 한눈에 관리하기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f7faf4;--surface:#fff;--text:#344238;--muted:#758278;--line:#e6eee5;--green:#8ebc91;--green-soft:#eaf4e7;--yellow:#f2d783;--yellow-soft:#fff7dc;--blue:#a8cfe0;--blue-soft:#edf7fb;--pink:#e8b9b1;--shadow:0 10px 30px rgba(67,94,69,.08);--radius:20px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:linear-gradient(145deg,#f7faf4,#f2f8f6 60%,#fffaf0);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh}button,input,select{font:inherit}.layout{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}.sidebar{position:sticky;top:24px;align-self:start;background:#eef5e9;border:1px solid #e3eddf;border-radius:24px;padding:22px 16px;box-shadow:var(--shadow);height:calc(100vh - 48px);display:flex;flex-direction:column}.brand{padding:4px 8px 22px;border-bottom:1px solid #dce8d9}.brand-mark{font-size:1.55rem}.brand h1{font-size:1.15rem;margin:6px 0 2px;font-weight:900}.brand p{margin:0;color:var(--muted);font-size:.78rem}.nav{display:grid;gap:7px;margin-top:20px}.nav a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:13px;text-decoration:none;color:#59685b;font-weight:700;font-size:.9rem;transition:.2s}.nav a:hover,.nav a.active{background:#fff;color:#557d59;box-shadow:0 4px 12px rgba(67,94,69,.08)}.tip{margin-top:auto;background:#fff8df;border-radius:15px;padding:14px;font-size:.8rem;line-height:1.6;color:#766a47}.tip strong{display:block;color:#71613a;margin-bottom:4px}.main{min-width:0}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 26px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}.hero h2{margin:0;font-size:1.55rem;letter-spacing:-.04em}.hero p{margin:6px 0 0;color:var(--muted);font-size:.88rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 15px;cursor:pointer;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-1px);filter:saturate(1.05)}.btn-green{background:#8ebc91;color:#fff}.btn-yellow{background:#f2d783;color:#554b2d}.btn-soft{background:#f1f5f0;color:#526455}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px 18px;box-shadow:var(--shadow)}.stat:nth-child(1){background:var(--green-soft)}.stat:nth-child(2){background:#fff0ed}.stat:nth-child(3){background:var(--yellow-soft)}.stat:nth-child(4){background:var(--blue-soft)}.stat-label{font-size:.8rem;font-weight:700;color:#66746a}.stat-value{font-size:1.45rem;font-weight:900;margin-top:8px;letter-spacing:-.04em}.section{scroll-margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:0 0 20px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section h3{margin:0;font-size:1.05rem;font-weight:900}.section-note{color:var(--muted);font-size:.78rem;margin-top:4px}.tx-list,.goal-list,.essential-list{display:grid;gap:9px}.tx-row{display:flex;align-items:center;gap:12px;background:#fafcf9;border:1px solid #edf1eb;border-radius:14px;padding:11px 13px}.tx-dot{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);font-size:1.1rem;flex:none}.tx-copy{min-width:0;flex:1}.tx-title{font-size:.9rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx-sub{font-size:.74rem;color:var(--muted);margin-top:3px}.tx-amount{font-weight:900;white-space:nowrap;font-size:.91rem}.tx-amount.income{color:#5d9b66}.tx-amount.expense{color:#c77d72}.delete{border:0;background:transparent;color:#9aa59b;cursor:pointer;padding:7px;border-radius:8px}.delete:hover{background:#fff0ed;color:#c77d72}.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.goal-card{padding:16px;border:1px solid #eaf0e8;background:#fbfdf9;border-radius:16px}.goal-name{font-weight:900;margin-bottom:4px}.goal-meta{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.progress{height:8px;background:#eaf0e8;border-radius:99px;overflow:hidden;margin:12px 0 8px}.progress span{height:100%;display:block;background:linear-gradient(90deg,#a8d1a2,#d8e9a1);border-radius:99px}.goal-actions{display:flex;gap:6px;margin-top:12px}.essential-row{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid #edf1eb;background:#fafcf9;border-radius:14px}.essential-row.paid{background:#f0f7ed}.check{width:22px;height:22px;border:1.5px solid #cbd9c9;border-radius:7px;background:white;color:#fff;cursor:pointer;flex:none}.paid .check{background:#8ebc91;border-color:#8ebc91}.ess-copy{flex:1;min-width:0}.ess-name{font-weight:800;font-size:.88rem}.paid .ess-name{text-decoration:line-through;color:var(--muted)}.ess-meta{font-size:.74rem;color:var(--muted);margin-top:3px}.ess-amount{font-size:.88rem;font-weight:900;white-space:nowrap}.total{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;margin-bottom:12px;border-radius:13px;background:var(--yellow-soft);font-size:.86rem;font-weight:800}.total strong{font-size:1.1rem}.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:.87rem;background:#fafcf9;border-radius:14px}.modal{position:fixed;inset:0;background:rgba(46,62,49,.35);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modal-box{width:min(440px,100%);background:#fff;border-radius:22px;padding:23px;box-shadow:0 20px 70px rgba(46,62,49,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:1.1rem}.close{border:0;background:#f1f5f0;border-radius:10px;padding:7px 10px;cursor:pointer}.field{margin-bottom:13px}.field label{display:block;font-size:.82rem;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dfe9dc;border-radius:11px;background:#fbfdf9;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:#9fc89c;box-shadow:0 0 0 3px #eaf4e7}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions button{flex:1}.toast{position:fixed;bottom:20px;right:20px;background:#344238;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:20;font-size:.86rem}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:850px){.layout{grid-template-columns:1fr;padding:14px;gap:14px}.sidebar{position:static;height:auto;padding:14px}.brand{display:flex;align-items:center;gap:9px;padding:0 4px 12px}.brand h1{margin:0}.brand p,.tip{display:none}.brand-mark{font-size:1.3rem}.nav{display:flex;overflow-x:auto;margin-top:12px;padding-bottom:2px}.nav a{white-space:nowrap;padding:9px 11px;font-size:.82rem}.hero{padding:18px;align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.section{padding:17px}}
    @media(max-width:480px){.layout{padding:10px}.hero h2{font-size:1.3rem}.actions{width:100%}.actions .btn{flex:1}.stat{padding:14px}.stat-value{font-size:1.2rem}.section-head{align-items:flex-start}.tx-row{gap:8px;padding:10px}.tx-amount{font-size:.82rem}.section{padding:14px}}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">🌱</span><div><h1>용돈플래너</h1><p>가볍게 기록하고, 차근차근 모아요</p></div></div>
      <nav class="nav" aria-label="페이지 메뉴">
        <a class="active" href="#dashboard">📊 대시보드</a><a href="#transactions">💳 거래내역</a><a href="#goals">🎯 목표</a><a href="#essential">📋 필수지출</a>
      </nav>
      <div class="tip"><strong>💡 오늘의 작은 습관</strong>작은 기록이 모이면 나만의 소비 흐름이 보여요.</div>
    </aside>
    <main class="main">
      <header class="hero" id="dashboard">
        <div><h2>나의 용돈 한눈에 보기 ☁️</h2><p id="today"></p></div>
        <div class="actions"><button class="btn btn-soft" onclick="openModal('goalModal')">＋ 목표 추가</button><button class="btn btn-yellow" onclick="openModal('essentialModal')">＋ 필수지출 추가</button><button class="btn btn-green" onclick="openModal('txModal')">＋ 거래 기록</button></div>
      </header>
      <div class="stats">
        <article class="stat"><div class="stat-label">🌿 이번 달 수입</div><div class="stat-value" id="incomeStat">₩0</div></article>
        <article class="stat"><div class="stat-label">🍑 이번 달 지출</div><div class="stat-value" id="expenseStat">₩0</div></article>
        <article class="stat"><div class="stat-label">🌼 남은 용돈</div><div class="stat-value" id="balanceStat">₩0</div></article>
        <article class="stat"><div class="stat-label">🫧 목표 달성률</div><div class="stat-value" id="goalStat">0%</div></article>
      </div>
      <section class="section" id="transactions">
        <div class="section-head"><div><h3>💳 거래내역</h3><div class="section-note">최근 기록을 간단하게 확인해요.</div></div><button class="btn btn-soft" onclick="openModal('txModal')">＋ 거래 기록</button></div>
        <div class="tx-list" id="txList"></div>
      </section>
      <section class="section" id="goals">
        <div class="section-head"><div><h3>🎯 저축 목표</h3><div class="section-note">원하는 목표와 현재 모은 금액을 관리해요.</div></div><button class="btn btn-soft" onclick="openModal('goalModal')">＋ 목표 추가</button></div>
        <div class="goal-list goal-grid" id="goalList"></div>
      </section>
      <section class="section" id="essential">
        <div class="section-head"><div><h3>📋 필수지출</h3><div class="section-note">이번 달 꼭 필요한 지출을 체크해요.</div></div><button class="btn btn-soft" onclick="openModal('essentialModal')">＋ 지출 추가</button></div>
        <div class="total"><span>필수지출 합계</span><strong id="essentialTotal">₩0</strong></div>
        <div class="essential-list" id="essentialList"></div>
      </section>
    </main>
  </div>
  <div class="modal" id="txModal" role="dialog" aria-modal="true" aria-labelledby="txModalTitle"><div class="modal-box"><div class="modal-head"><h3 id="txModalTitle">거래 기록 추가</h3><button class="close" onclick="closeModal('txModal')" aria-label="닫기">✕</button></div><form id="txForm"><div class="field"><label for="txType">구분</label><select id="txType"><option value="expense">지출</option><option value="income">수입</option></select></div><div class="field"><label for="txName">항목</label><input id="txName" maxlength="40" placeholder="예: 간식, 용돈" required></div><div class="field"><label for="txAmount">금액</label><input id="txAmount" type="number" min="1" placeholder="금액 입력" required></div><div class="modal-actions"><button type="button" class="btn btn-soft" onclick="closeModal('txModal')">취소</button><button class="btn btn-green">저장</button></div></form></div></div>
  <div class="modal" id="goalModal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle"><div class="modal-box"><div class="modal-head"><h3 id="goalModalTitle">저축 목표 추가</h3><button class="close" onclick="closeModal('goalModal')" aria-label="닫기">✕</button></div><form id="goalForm"><div class="field"><label for="goalName">목표 이름</label><input id="goalName" maxlength="40" placeholder="예: 새 자전거" required></div><div class="field"><label for="goalTarget">목표 금액</label><input id="goalTarget" type="number" min="1" placeholder="금액 입력" required></div><div class="field"><label for="goalCurrent">현재 모은 금액</label><input id="goalCurrent" type="number" min="0" value="0"></div><div class="modal-actions"><button type="button" class="btn btn-soft" onclick="closeModal('goalModal')">취소</button><button class="btn btn-green">저장</button></div></form></div></div>
  <div class="modal" id="essentialModal" role="dialog" aria-modal="true" aria-labelledby="essentialModalTitle"><div class="modal-box"><div class="modal-head"><h3 id="essentialModalTitle">필수지출 추가</h3><button class="close" onclick="closeModal('essentialModal')" aria-label="닫기">✕</button></div><form id="essentialForm"><div class="field"><label for="essentialName">항목</label><input id="essentialName" maxlength="40" placeholder="예: 교통비, 통신비" required></div><div class="field"><label for="essentialAmount">예상 금액</label><input id="essentialAmount" type="number" min="1" placeholder="금액 입력" required></div><div class="modal-actions"><button type="button" class="btn btn-soft" onclick="closeModal('essentialModal')">취소</button><button class="btn btn-green">저장</button></div></form></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const STORAGE_KEY='pocketMoneyTracker_pastel_v1';
    const blankData={transactions:[],goals:[],essentials:[]};
    let data=loadData();
    function loadData(){try{return {...blankData,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch{return {...blankData}}}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));render()}
    function money(value){return '₩'+Number(value||0).toLocaleString('ko-KR')}
    function safe(value){const el=document.createElement('span');el.textContent=String(value??'');return el.innerHTML}
    function notify(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
    function openModal(id){document.getElementById(id).classList.add('open');const first=document.querySelector('#'+id+' input');if(first)setTimeout(()=>first.focus(),30)}
    function closeModal(id){document.getElementById(id).classList.remove('open')}
    function removeItem(group,id){data[group]=data[group].filter(item=>item.id!==id);save();notify('항목을 삭제했어요.')}
    function monthTransactions(){const now=new Date();return data.transactions.filter(item=>{const d=new Date(item.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()})}
    function render(){
      const tx=monthTransactions(),income=tx.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0),expense=tx.filter(x=>x.type==='expense').reduce((s,x)=>s+x.amount,0),goalTarget=data.goals.reduce((s,g)=>s+g.target,0),goalCurrent=data.goals.reduce((s,g)=>s+Math.min(g.current,g.target),0);
      document.getElementById('incomeStat').textContent=money(income);document.getElementById('expenseStat').textContent=money(expense);document.getElementById('balanceStat').textContent=money(income-expense);document.getElementById('goalStat').textContent=(goalTarget?Math.round(goalCurrent/goalTarget*100):0)+'%';
      const date=new Date();document.getElementById('today').textContent=date.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
      const txList=document.getElementById('txList');const sorted=[...data.transactions].sort((a,b)=>b.created-a.created);
      txList.innerHTML=sorted.length?sorted.map(t=>`<div class="tx-row"><div class="tx-dot">${t.type==='income'?'🌱':'🧺'}</div><div class="tx-copy"><div class="tx-title">${safe(t.name)}</div><div class="tx-sub">${t.type==='income'?'수입':'지출'} · ${new Date(t.date).toLocaleDateString('ko-KR')}</div></div><div class="tx-amount ${t.type}">${t.type==='income'?'+':'−'}${money(t.amount)}</div><button class="delete" onclick="removeItem('transactions','${t.id}')" aria-label="${safe(t.name)} 거래 삭제">✕</button></div>`).join(''):'<div class="empty">아직 거래내역이 없어요. 첫 기록을 추가해 보세요 🌱</div>';
      const goalList=document.getElementById('goalList');goalList.innerHTML=data.goals.length?data.goals.map(g=>{const pct=Math.min(100,Math.round(g.current/g.target*100));return `<article class="goal-card"><div class="goal-name">🎯 ${safe(g.name)}</div><div class="goal-meta"><span>${money(g.current)} 모았어요</span><span>${pct}%</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="goal-meta"><span>목표 금액</span><strong>${money(g.target)}</strong></div><div class="goal-actions"><button class="btn btn-soft" onclick="addToGoal('${g.id}')">＋ 저축 기록</button><button class="delete" onclick="removeItem('goals','${g.id}')" aria-label="${safe(g.name)} 목표 삭제">삭제</button></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1">아직 목표가 없어요. 작은 목표부터 만들어 보세요 🌼</div>';
      const total=data.essentials.reduce((s,e)=>s+e.amount,0);document.getElementById('essentialTotal').textContent=money(total);const list=document.getElementById('essentialList');list.innerHTML=data.essentials.length?data.essentials.map(e=>`<div class="essential-row ${e.paid?'paid':''}"><button class="check" onclick="toggleEssential('${e.id}')" aria-label="${safe(e.name)} 납부 상태 변경">${e.paid?'✓':''}</button><div class="ess-copy"><div class="ess-name">${safe(e.name)}</div><div class="ess-meta">${e.paid?'납부 완료':'납부 전'}</div></div><div class="ess-amount">${money(e.amount)}</div><button class="delete" onclick="removeItem('essentials','${e.id}')" aria-label="${safe(e.name)} 지출 삭제">✕</button></div>`).join(''):'<div class="empty">등록된 필수지출이 없어요 📋</div>';
    }
    function toggleEssential(id){const item=data.essentials.find(e=>e.id===id);if(item){item.paid=!item.paid;save()}}
    function addToGoal(id){const g=data.goals.find(item=>item.id===id);if(!g)return;const value=Number(prompt('얼마를 저축했나요?'));if(!Number.isFinite(value)||value<=0)return;g.current=Math.min(g.target,g.current+value);save();notify('목표 저축을 기록했어요!')}
    document.getElementById('txForm').addEventListener('submit',event=>{event.preventDefault();data.transactions.unshift({id:crypto.randomUUID(),type:document.getElementById('txType').value,name:document.getElementById('txName').value.trim(),amount:Number(document.getElementById('txAmount').value),date:new Date().toISOString(),created:Date.now()});save();event.target.reset();closeModal('txModal');notify('거래내역을 저장했어요.')});
    document.getElementById('goalForm').addEventListener('submit',event=>{event.preventDefault();data.goals.push({id:crypto.randomUUID(),name:document.getElementById('goalName').value.trim(),target:Number(document.getElementById('goalTarget').value),current:Number(document.getElementById('goalCurrent').value)||0});save();event.target.reset();closeModal('goalModal');notify('새 목표를 추가했어요.')});
    document.getElementById('essentialForm').addEventListener('submit',event=>{event.preventDefault();data.essentials.push({id:crypto.randomUUID(),name:document.getElementById('essentialName').value.trim(),amount:Number(document.getElementById('essentialAmount').value),paid:false});save();event.target.reset();closeModal('essentialModal');notify('필수지출을 추가했어요.')});
    document.querySelectorAll('.modal').forEach(modal=>modal.addEventListener('click',event=>{if(event.target===modal)closeModal(modal.id)}));document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelectorAll('.modal.open').forEach(modal=>closeModal(modal.id))});
    document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>{document.querySelectorAll('.nav a').forEach(item=>item.classList.remove('active'));link.classList.add('active')}));
    render();
  </script>
</body>
</html>
